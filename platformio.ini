; GV200 contactor economizer - two channel, STM32G031K8
; Bench target: Nucleo-G031K8 (same MCU as the PCB).
; (ADC is enabled by default in STM32duino; no HAL_ADC_MODULE_ENABLED flag needed.)
[env:nucleo_g031k8]
platform = ststm32
board = nucleo_g031k8
framework = arduino
; Settings live in the last 2 kB flash page (EEPROM emulation): cap the program at 62 kB so
; the linker refuses any build that would overlap it.
board_upload.maximum_size = 63488
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    ; Room for a whole log line so Serial.print never blocks the 1 kHz loop.
    -D SERIAL_TX_BUFFER_SIZE=256
